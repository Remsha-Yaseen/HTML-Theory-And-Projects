<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>

<h1 id="title">Survey Form</h1>
<p id="description">Thank you for taking the time to help us improve our platform.</p>
<form id="survey-form">
<label id="name-label" for="name">Name</label>
<input 
  type="text" 
  id="name" 
  placeholder="Enter your name" 
  required 
/>
<label id="email-label" for="email">Email Address:</label>

<input 
  type="email" 
  id="email" 
  name="email"
  placeholder="example@mail.com" 
  required
>

<button type="submit" id="submit">Submit</button>

<label id="number-label" for="number">Age (optional):</label>
<input 
  type="number" 
  id="number" 
  min="10" 
  max="99" 
  placeholder="Enter a number"
/>
<label for="dropdown">Which option best describes your current role?</label>
<select id="dropdown" required>
  <option disabled selected value="">Select current role</option>
  <option value="student">Student</option>
  <option value="job">Full Time Job</option>
  <option value="learner">Prefer not to say</option>
  <option value="other">Other</option>
</select>

<p>Would you recommend our service to a friend?</p>

<label>
  <input 
    type="radio" 
    name="user-recommend" 
    value="definitely" 
    checked 
  /> Definitely
</label>

<label>
  <input 
    type="radio" 
    name="user-recommend" 
    value="maybe" 
  /> Maybe
</label>

<label>
  <input 
    type="radio" 
    name="user-recommend" 
    value="not-sure" 
  /> Not sure
</label>

<p>What improvements would you like to see? (Check all that apply)</p>

<label>
  <input 
    type="checkbox" 
    name="prefer" 
    value="front-end-projects" 
  /> Front-end Projects
</label>

<label>
  <input 
    type="checkbox" 
    name="prefer" 
    value="back-end-projects" 
  /> Back-end Projects
</label>

<label>
  <input 
    type="checkbox" 
    name="prefer" 
    value="data-visualization" 
  /> Data Visualization
</label>

<label>
  <input 
    type="checkbox" 
    name="prefer" 
    value="challenges" 
  /> Challenges
</label>

<label for="comments">Any additional comments or suggestions?</label>
<textarea 
  id="comments" 
  name="comment" 
  placeholder="Enter your comment here..."
></textarea>

<button type="submit" id="submit">Submit</button>


  </form>
  </body>
</html>
